<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pembayaran QRIS - HD UI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-image: url('https://files.catbox.moe/zpbmn5.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 35px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 25px;
      color: #ffd700;
      text-shadow: 1px 1px 4px #000;
    }

    .qr-img {
      width: 60%;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 25px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .qr-img:hover {
      transform: scale(1.05);
    }

    .note {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 25px;
    }

    .note span {
      color: #00fff0;
      font-weight: bold;
    }

    .payment-info {
      background: rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    .payment-label {
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 15px;
    }

    .copy-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .copy-box span {
      color: #ffd700;
      font-weight: 600;
      font-size: 16px;
    }

    .copy-btn {
      background: #00fff0;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: 0.2s;
    }

    .copy-btn:hover {
      background: #00d6c4;
    }

    .wa-btn {
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    .wa-btn:hover {
      background-color: #1ebd58;
    }

    /* Popup QR */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup img {
      width: 80%;
      max-width: 420px;
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 500px) {
      .qr-img { width: 70%; }
      .popup img { width: 90%; }
      h1 { font-size: 24px; }
      .note, .payment-label { font-size: 14px; }
      .copy-box span { font-size: 14px; }
      .copy-btn { font-size: 12px; }
      .wa-btn { font-size: 15px; padding: 12px 18px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>QRIS Pembayaran</h1>
    <img src="https://files.catbox.moe/nfoa7i.jpeg" alt="QRIS" class="qr-img" onclick="showPopup()">
    <p class="note">Jangan lupa untuk <span>Screenshot</span> dan kirim ke <span>Owner</span>!</p>

    <div class="payment-info">
      <div class="payment-label">Nomor DANA:</div>
      <div class="copy-box">
        <span id="dana1">083106133182</span>
        <button class="copy-btn" onclick="copyText('dana1')">Salin</button>
      </div>

      <div class="payment-label">Nomor OVO:</div>
      <div class="copy-box">
        <span id="ovo1">083135353690</span>
        <button class="copy-btn" onclick="copyText('ovo1')">Salin</button>
      </div>

      <div class="payment-label">Nomor GoPay:</div>
      <div class="copy-box">
        <span id="gopay1">083135353690</span>
        <button class="copy-btn" onclick="copyText('gopay1')">Salin</button>
      </div>
    </div>

    <a href="https://wa.me/6283106133182?text=Min%20saya%20mau%20bayar" target="_blank">
      <button class="wa-btn">Hubungi via WhatsApp</button>
    </a>
  </div>

  <!-- Popup -->
  <div class="popup" id="popup" onclick="hidePopup()">
    <img src="https://files.catbox.moe/nfoa7i.jpeg" alt="QRIS Zoom">
  </div>

  <script>
    function showPopup() {
      document.getElementById("popup").style.display = "flex";
    }

    function hidePopup() {
      document.getElementById("popup").style.display = "none";
    }

    function copyText(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Nomor berhasil disalin: " + text);
      });
    }
  </script>
</body>
</html>
